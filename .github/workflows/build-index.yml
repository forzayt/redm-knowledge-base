name: Build Index

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-index:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tree
        run: sudo apt-get update && sudo apt-get install -y tree

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Generate HTML
        run: |
          tree \
            -H "." \
            --dirsfirst \
            --charset utf-8 \
            -T "REDM Knowledge Base Index" \
            -I ".git|.github|node_modules|index.html" \
            -o index.html

          python3 << 'EOF'
          from pathlib import Path
          import re

          OWNER = "forzayt"
          REPO = "RedM-Knowledge-Base"
          BRANCH = "main"

          RAW = f"https://raw.githubusercontent.com/{OWNER}/{REPO}/{BRANCH}/"

          html = Path("index.html").read_text("utf-8")

          def replace(match):
              href = match.group(1)

              if href.startswith(("http://", "https://", "#", "?")):
                  return match.group(0)

              href = href.lstrip("./")

              if href.endswith("/"):
                  return f'href="{href}"'

              return f'href="{RAW}{href}" target="_blank"'

          html = re.sub(r'href="([^"]+)"', replace, html)

          html = html.replace(
              "</body>",
              """
              <hr>
              <p>
              Generated automatically • Raw links for AI crawlers • GitHub Pages
              </p>
              </body>
              """
          )

          Path("index.html").write_text(html, encoding="utf-8")
          EOF

      - name: Commit and push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add index.html
          git diff --staged --quiet || git commit -m "chore: auto-update index.html [skip ci]"
          git push
