- name: Generate HTML
  run: |
    tree \
      -H "." \
      --dirsfirst \
      --charset utf-8 \
      -T "Repository Index" \
      -I ".git|.github|node_modules|index.html" \
      -o index.html

    python3 << 'EOF'
    from pathlib import Path
    import re

    OWNER = "forzayt"
    REPO = "redm-knowledge-base"
    BRANCH = "main"

    RAW = f"https://raw.githubusercontent.com/{OWNER}/{REPO}/{BRANCH}/"

    html = Path("index.html").read_text("utf-8")

    def replace(match):
        href = match.group(1)

        if href.startswith(("http://", "https://", "#", "?")):
            return match.group(0)

        href = href.lstrip("./")

        # Keep folders inside GitHub Pages
        if href.endswith("/"):
            return f'href="{href}"'

        # Everything else goes to raw.githubusercontent.com
        return f'href="{RAW}{href}" target="_blank"'

    html = re.sub(r'href="([^"]+)"', replace, html)

    html = html.replace(
        "</body>",
        """
        <hr>
        <p>
        Generated automatically • Raw links for AI crawlers • GitHub Pages
        </p>
        </body>
        """
    )

    Path("index.html").write_text(html, encoding="utf-8")
    EOF